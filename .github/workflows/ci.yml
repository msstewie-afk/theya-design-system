# CI for the Theya monorepo.
#
# checks     — every run: types, generated spec and public API report are
#              up to date, the sandbox app builds against the package.
# storybook  — after checks: static Storybook, then the test-runner on it:
#              play + axe in light and dark, visual regression in both.
# react-19   — after checks, alongside storybook: the same code with React 19
#              forced across the workspace (the package supports 18 and 19,
#              dev and the main jobs stay on 18): types, then play + axe.
# brands     — after checks, one job per product theme (iris, lime): play +
#              axe in its light and dark variants. No visual baselines: the
#              storybook job's are for Theya's own look.
# mobile     — after checks: play + axe at 360px (the narrowest common phone)
#              in light and dark; the test-runner also fails a story that
#              scrolls the page sideways there. Stories tagged desktop-play
#              (their play test drives a desktop-only layout) are skipped.
#
# The repo is public, so Actions minutes are free: every push to main and
# every pull request runs all the jobs. The weekly run catches drift that
# comes from outside the repo (runner image, browser, fonts).
# Docs-only changes (*.md, .claude/, .changeset/) start nothing.
#
# Visual baselines are rendered on this runner and kept in git, in the
# visual-baselines branch (not on main: macOS and Linux render fonts
# differently, so local baselines stay local and git-ignored).
# - Pull requests compare against that branch and fail on a change.
# - main (push, weekly run, manual run) records instead of comparing: what
#   is on main is the accepted look. Changed, new and removed snapshots are
#   committed to visual-baselines (one commit per run: GitHub shows each
#   PNG before / after), listed in the run summary and uploaded as
#   "visual-changes", so a change is visible and reviewable but never turns
#   main red and never needs a manual re-run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', '.changeset/**']
  pull_request:
    paths-ignore: ['**/*.md', '.claude/**', '.changeset/**']
  # Weekly full run (Monday 05:17 UTC): drift from outside the repo.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
# Runner image pinned: visual baselines are only comparable on the same
# OS image (fonts, anti-aliasing). Moving to a newer one re-records them on
# the next main run (every snapshot shows up as changed once).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.8.0

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens

      - name: Types
        working-directory: packages/theya-shadcn
        run: pnpm exec tsc --noEmit -p .

      - name: Spec and public API are up to date
        working-directory: packages/theya-shadcn
        run: pnpm api:check

      - name: Sandbox app builds against the package
        run: pnpm --filter @theya/sandbox build

  storybook:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Pushes the visual-baselines branch (main only; pull requests from forks
    # get a read-only token and never reach that step).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # playwright is a dependency of the test-runner, not of this package,
      # so it has no bin here (and npx picks the unlinked workspace copy):
      # run the CLI of the exact Playwright the test-runner resolves.
      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          echo "playwright $(node -p "require('$PW_DIR/package.json').version") at $PW_DIR"
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe, light
        run: pnpm test-storybook

      - name: Play + axe, dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark

      # ---- Visual regression -------------------------------------------
      # Baselines live in git, in the visual-baselines branch (light/, dark/,
      # one PNG per story id). Only this job on main writes it, so every
      # accepted change is a commit there: GitHub shows each PNG before /
      # after, and history keeps every look. No branch yet = first run.
      - name: Fetch visual baselines
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        id: baselines
        working-directory: .
        run: |
          dir="$RUNNER_TEMP/baselines"; rm -rf "$dir"
          if git ls-remote --exit-code --heads origin visual-baselines >/dev/null; then
            git fetch --quiet --depth 1 origin visual-baselines
            git worktree add --quiet -B visual-baselines "$dir" FETCH_HEAD
            echo "sha=$(git -C "$dir" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Baselines: visual-baselines @ $(git -C "$dir" rev-parse --short HEAD)"
          else
            git worktree add --quiet --detach "$dir"
            git -C "$dir" checkout --quiet --orphan visual-baselines
            git -C "$dir" rm -rfq --ignore-unmatch .
            echo "No visual-baselines branch yet: this run records all of them"
          fi
          rm -rf packages/theya-shadcn/__visual__ && mkdir -p packages/theya-shadcn/__visual__
          for t in light dark; do
            if [ -d "$dir/$t" ]; then cp -r "$dir/$t" packages/theya-shadcn/__visual__/; fi
          done

      # main records (see the header); a pull request compares. Also records
      # when there are no baselines yet (first run). The baselines as they
      # were are kept aside to list what changed.
      - name: Decide visual mode
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "${{ steps.baselines.outputs.sha }}" ]; then
            echo "flags=-u" >> "$GITHUB_OUTPUT"
            echo "Recording visual baselines"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "Comparing with visual-baselines @ ${{ steps.baselines.outputs.sha }}"
          fi
          rm -rf "$RUNNER_TEMP/visual-before"
          cp -r __visual__ "$RUNNER_TEMP/visual-before"

      # CI=false: a story added since the last baseline gets its first
      # snapshot recorded (as locally) instead of failing as "missing".
      - name: Visual, light
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          CI: 'false'
        run: pnpm test-visual ${{ steps.mode.outputs.flags }}

      - name: Visual, dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          CI: 'false'
        run: pnpm test-visual:dark ${{ steps.mode.outputs.flags }}

      # Recording mode: drop the baselines of stories that no longer exist,
      # list the snapshots that differ from the previous baselines (new and
      # removed included) and keep before / after copies.
      - name: List visual changes
        if: ${{ !cancelled() && steps.mode.outputs.flags == '-u' }}
        id: changes
        run: |
          node -e "for (const e of Object.values(require('./storybook-static/index.json').entries)) if (e.type === 'story') console.log(e.id)" > "$RUNNER_TEMP/story-ids"
          out="$RUNNER_TEMP/visual-changes"; rm -rf "$out"; n=0; list=""
          while IFS= read -r f; do
            if ! grep -qxF "$(basename "$f" .png)" "$RUNNER_TEMP/story-ids"; then rm "$f"; fi
          done < <(find __visual__ -name '*.png' -not -path '*/__diff__/*')
          while IFS= read -r f; do
            rel="${f#__visual__/}"; old="$RUNNER_TEMP/visual-before/$rel"
            if [ ! -f "$old" ] || ! cmp -s "$f" "$old"; then
              n=$((n+1)); list="$list"$'\n'"- \`$rel\`$( [ -f "$old" ] || echo ' (new)')"
              mkdir -p "$out/after/$(dirname "$rel")"; cp "$f" "$out/after/$rel"
              if [ -f "$old" ]; then mkdir -p "$out/before/$(dirname "$rel")"; cp "$old" "$out/before/$rel"; fi
            fi
          done < <(find __visual__ -name '*.png' -not -path '*/__diff__/*' | sort)
          while IFS= read -r f; do
            rel="${f#$RUNNER_TEMP/visual-before/}"
            if [ ! -f "__visual__/$rel" ]; then n=$((n+1)); list="$list"$'\n'"- \`$rel\` (removed)"; fi
          done < <(find "$RUNNER_TEMP/visual-before" -name '*.png' -not -path '*/__diff__/*' | sort)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$list" > "$RUNNER_TEMP/visual-list"

      - name: Upload visual changes
        if: ${{ !cancelled() && steps.changes.outputs.count != '0' && steps.changes.outputs.count != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-changes
          path: ${{ runner.temp }}/visual-changes/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: packages/theya-shadcn/__visual__/*/__diff__/
          if-no-files-found: ignore
          retention-days: 14

      # Only a green run becomes the next baseline, and pull requests never
      # write. One commit per run in visual-baselines, named after the main
      # commit that changed the look; its diff is the review.
      - name: Commit visual baselines
        if: success() && github.event_name != 'pull_request' && steps.changes.outputs.count != '0'
        working-directory: .
        run: |
          dir="$RUNNER_TEMP/baselines"
          for t in light dark; do
            rm -rf "$dir/$t"
            if [ -d "packages/theya-shadcn/__visual__/$t" ]; then
              cp -r "packages/theya-shadcn/__visual__/$t" "$dir/$t"; rm -rf "$dir/$t/__diff__"
            fi
          done
          cat > "$dir/README.md" <<'MD'
          # Visual baselines

          CI's screenshots of every Storybook story (light/, dark/), one PNG per
          story id. Written only by the storybook job of the CI workflow on main:
          each commit here is the look a main commit changed. Don't edit by hand.
          To undo a change, fix the code on main; the next run records it again.
          MD
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "visual: ${{ steps.changes.outputs.count }} change(s) from ${GITHUB_SHA::7}" \
            -m "$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s "$GITHUB_SHA")" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # A run that started earlier may have pushed meanwhile: then this
          # one only warns; the next main run records the same look again.
          if git push --quiet origin HEAD:visual-baselines; then
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::visual-baselines moved during this run; not recorded"
          fi
        id: commit

      - name: Visual summary
        if: ${{ !cancelled() && steps.changes.outputs.count != '' }}
        run: |
          {
            echo "### Visual changes: ${{ steps.changes.outputs.count }}"
            if [ "${{ steps.changes.outputs.count }}" != "0" ]; then
              if [ -n "${{ steps.commit.outputs.url }}" ]; then
                echo "Recorded as the new baselines: ${{ steps.commit.outputs.url }} (before / after per PNG). Also as the artifact **visual-changes**."
              else
                echo "Not recorded (the run failed). Before / after PNGs: artifact **visual-changes**."
              fi
              cat "$RUNNER_TEMP/visual-list"
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  brands:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        brand: [iris, lime]
    name: brand (${{ matrix.brand }})
    env:
      THEYA_BRAND: ${{ matrix.brand }}
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:tokens
        working-directory: .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe, ${{ matrix.brand }} light
        run: pnpm test-storybook

      - name: Play + axe, ${{ matrix.brand }} dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark

  mobile:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: phone (360)
    env:
      THEYA_VIEWPORT: 360
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:tokens
        working-directory: .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe at 360px, light
        run: pnpm test-storybook

      - name: Play + axe at 360px, dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark

  react-19:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Overrides reach every package, so no dependency can pull React 18
      # into the Storybook bundle.
      - name: Force React 19
        working-directory: .
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'
          overrides:
            react: ^19.0.0
            react-dom: ^19.0.0
            '@types/react': ^19.0.0
            '@types/react-dom': ^19.0.0
          YAML
          pnpm install --no-frozen-lockfile
      - name: Only React 19 is installed
        working-directory: .
        run: |
          node -p "'react ' + require('./packages/theya-shadcn/node_modules/react/package.json').version"
          if ls node_modules/.pnpm | grep -E '^react(-dom)?@18\.'; then echo "React 18 still installed"; exit 1; fi
      - run: pnpm build:tokens
        working-directory: .

      - name: Types
        run: pnpm exec tsc --noEmit -p .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      # Light only: play tests and axe don't depend on the theme for React
      # behaviour; the storybook job covers dark and visual regression.
      - name: Play + axe on React 19
        run: pnpm test-storybook
