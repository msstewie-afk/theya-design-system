# CI for the Theya monorepo.
#
# checks     — every run: types, generated spec and public API report are
#              up to date, the publishable dist/ build imports in Node
#              (scripts/check-package.mjs), the sandbox app builds.
# storybook  — after checks, on four machines (--shard 1/4…4/4, each a
#              quarter of the story files): static Storybook, then the
#              test-runner on it: play + axe in light and dark, visual
#              regression in both.
# visual-baselines — after storybook (main only): writes the four shards'
#              snapshots to the visual-baselines branch in one commit.
# react-18   — after checks, alongside storybook, on two machines: the same
#              code with React 18 forced across the workspace (the package
#              supports 18 and 19; dev and the main jobs run on 19 since
#              2026-11-08): types, then play + axe (--shard 1/2, 2/2).
# brands     — after checks, one job per product theme (iris, lime, ember): play +
#              axe in its light and dark variants. No visual baselines: the
#              storybook job's are for Theya's own look.
# a11y       — after checks: scripts/a11y-tree.mjs (accessibility tree:
#              names, unnamed images, table headers, error association) and
#              scripts/a11y-auto.mjs (label in name, focus visible, text
#              spacing, 200% text, Tab order), both in --ci mode: nothing is
#              written, any finding fails the job and is listed in the run
#              summary. The committed a11y/*.json stay the local runs' record.
# mobile     — after checks: play + axe at 360px (the narrowest common phone)
#              in light and dark; the test-runner also fails a story that
#              scrolls the page sideways there. Stories tagged desktop-play
#              (their play test drives a desktop-only layout) are skipped.
#
# The repo is public, so Actions minutes are free: every push to main and
# every pull request runs all the jobs. The weekly run catches drift that
# comes from outside the repo (runner image, browser, fonts).
# Docs-only changes (*.md, .claude/, .changeset/) start nothing.
#
# Visual baselines are rendered on this runner and kept in git, in the
# visual-baselines branch (not on main: macOS and Linux render fonts
# differently, so local baselines stay local and git-ignored).
# - Pull requests compare against that branch and fail on a change.
# - main (push, weekly run, manual run) records instead of comparing: what
#   is on main is the accepted look. Changed, new and removed snapshots are
#   committed to visual-baselines by the visual-baselines job, after all four
#   storybook shards (one commit per run: GitHub shows each
#   PNG before / after), listed in the run summary and uploaded as
#   "visual-changes", so a change is visible and reviewable but never turns
#   main red and never needs a manual re-run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', '.changeset/**']
  pull_request:
    paths-ignore: ['**/*.md', '.claude/**', '.changeset/**']
  # Weekly full run (Monday 05:17 UTC): drift from outside the repo.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
# Runner image pinned: visual baselines are only comparable on the same
# OS image (fonts, anti-aliasing). Moving to a newer one re-records them on
# the next main run (every snapshot shows up as changed once).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.8.0

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens

      - name: Types
        working-directory: packages/theya-shadcn
        run: pnpm exec tsc --noEmit -p .

      - name: Spec and public API are up to date
        working-directory: packages/theya-shadcn
        run: pnpm api:check

      - name: Package builds for outside apps (dist imports in Node, 'use client' kept)
        working-directory: packages/theya-shadcn
        run: node scripts/check-package.mjs

      - name: Sandbox app builds against the package
        run: pnpm --filter @theya/sandbox build

  # Four machines, each one quarter of the story files (the test-runner's
  # --shard: jest splits by file, so all stories of a component stay on one
  # machine). Every shard builds Storybook itself: the build is ~2 minutes,
  # less than passing it between jobs. Each shard compares or records only its
  # own snapshots and uploads what changed; visual-baselines then writes them
  # to the baselines branch in one commit, as before.
  storybook:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: storybook (${{ matrix.shard }}/4)
    env:
      SHARD: ${{ matrix.shard }}/4
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # playwright is a dependency of the test-runner, not of this package,
      # so it has no bin here (and npx picks the unlinked workspace copy):
      # run the CLI of the exact Playwright the test-runner resolves.
      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          echo "playwright $(node -p "require('$PW_DIR/package.json').version") at $PW_DIR"
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe, light (shard ${{ env.SHARD }})
        run: pnpm test-storybook --shard=$SHARD

      - name: Play + axe, dark (shard ${{ env.SHARD }})
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark --shard=$SHARD

      # ---- Visual regression -------------------------------------------
      # Baselines live in git, in the visual-baselines branch (light/, dark/,
      # one PNG per story id). Each shard reads the whole branch and touches
      # only its own stories' snapshots.
      - name: Fetch visual baselines
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        id: baselines
        working-directory: .
        run: |
          dir="$RUNNER_TEMP/baselines"; rm -rf "$dir"
          if git ls-remote --exit-code --heads origin visual-baselines >/dev/null; then
            git fetch --quiet --depth 1 origin visual-baselines
            git worktree add --quiet --detach "$dir" FETCH_HEAD
            echo "sha=$(git -C "$dir" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Baselines: visual-baselines @ $(git -C "$dir" rev-parse --short HEAD)"
          else
            mkdir -p "$dir"
            echo "No visual-baselines branch yet: this run records all of them"
          fi
          rm -rf packages/theya-shadcn/__visual__ && mkdir -p packages/theya-shadcn/__visual__
          for t in light dark; do
            if [ -d "$dir/$t" ]; then cp -r "$dir/$t" packages/theya-shadcn/__visual__/; fi
          done

      # main records (see the header); a pull request compares. Also records
      # when there are no baselines yet (first run). The baselines as they
      # were are kept aside to find what this shard changed.
      - name: Decide visual mode
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "${{ steps.baselines.outputs.sha }}" ]; then
            echo "flags=-u" >> "$GITHUB_OUTPUT"
            echo "Recording visual baselines"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "Comparing with visual-baselines @ ${{ steps.baselines.outputs.sha }}"
          fi
          rm -rf "$RUNNER_TEMP/visual-before"
          cp -r __visual__ "$RUNNER_TEMP/visual-before"

      # CI=false: a story added since the last baseline gets its first
      # snapshot recorded (as locally) instead of failing as "missing".
      - name: Visual, light (shard ${{ env.SHARD }})
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          CI: 'false'
        run: pnpm test-visual --shard=$SHARD ${{ steps.mode.outputs.flags }}

      - name: Visual, dark (shard ${{ env.SHARD }})
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          CI: 'false'
        run: pnpm test-visual:dark --shard=$SHARD ${{ steps.mode.outputs.flags }}

      # Recording mode: the snapshots this shard wrote that differ from the
      # baselines (new ones included). Removed stories are found once, in
      # visual-baselines, from the full story list.
      - name: Collect this shard's visual changes
        if: ${{ !cancelled() && steps.mode.outputs.flags == '-u' }}
        run: |
          out="$RUNNER_TEMP/visual-shard"; rm -rf "$out"; mkdir -p "$out"
          while IFS= read -r f; do
            rel="${f#__visual__/}"; old="$RUNNER_TEMP/visual-before/$rel"
            if [ ! -f "$old" ] || ! cmp -s "$f" "$old"; then
              mkdir -p "$out/$(dirname "$rel")"; cp "$f" "$out/$rel"
            fi
          done < <(find __visual__ -name '*.png' -not -path '*/__diff__/*' | sort)
          echo "Changed or new snapshots in this shard: $(find "$out" -name '*.png' | wc -l)"
          if [ "${{ matrix.shard }}" = "1" ]; then
            node -e "for (const e of Object.values(require('./storybook-static/index.json').entries)) if (e.type === 'story') console.log(e.id)" > "$out/story-ids"
          fi

      - name: Upload this shard's visual changes
        if: ${{ !cancelled() && steps.mode.outputs.flags == '-u' }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/visual-shard/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: packages/theya-shadcn/__visual__/*/__diff__/
          if-no-files-found: ignore
          retention-days: 14

  # Gathers the four shards' snapshots into visual-baselines: one commit per
  # run, named after the main commit that changed the look (its diff is the
  # review). Only a fully green storybook run is recorded, and pull requests
  # never write. Also lists the changes in the run summary and uploads them
  # as "visual-changes" (before / after PNGs).
  visual-baselines:
    needs: storybook
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes the visual-baselines branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download the shards' changes
        uses: actions/download-artifact@v7
        with:
          pattern: visual-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Merge into the baselines
        id: changes
        run: |
          dir="$RUNNER_TEMP/baselines"; rm -rf "$dir"
          if git ls-remote --exit-code --heads origin visual-baselines >/dev/null; then
            git fetch --quiet --depth 1 origin visual-baselines
            git worktree add --quiet -B visual-baselines "$dir" FETCH_HEAD
          else
            git worktree add --quiet --detach "$dir"
            git -C "$dir" checkout --quiet --orphan visual-baselines
            git -C "$dir" rm -rfq --ignore-unmatch .
          fi
          src="$RUNNER_TEMP/shards"; out="$RUNNER_TEMP/visual-changes"; rm -rf "$out"; n=0; list=""
          if [ ! -f "$src/story-ids" ]; then
            echo "No story list from shard 1: nothing to record"; echo "count=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          while IFS= read -r f; do
            rel="${f#$src/}"; old="$dir/$rel"
            n=$((n+1)); list="$list"$'\n'"- \`$rel\`$( [ -f "$old" ] || echo ' (new)')"
            mkdir -p "$out/after/$(dirname "$rel")"; cp "$f" "$out/after/$rel"
            if [ -f "$old" ]; then mkdir -p "$out/before/$(dirname "$rel")"; cp "$old" "$out/before/$rel"; fi
            mkdir -p "$dir/$(dirname "$rel")"; cp "$f" "$dir/$rel"
          done < <(find "$src" -name '*.png' | sort)
          # Snapshots of stories that no longer exist.
          while IFS= read -r f; do
            if ! grep -qxF "$(basename "$f" .png)" "$src/story-ids"; then
              rel="${f#$dir/}"; n=$((n+1)); list="$list"$'\n'"- \`$rel\` (removed)"; rm "$f"
            fi
          done < <(find "$dir/light" "$dir/dark" -name '*.png' 2>/dev/null | sort)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$list" > "$RUNNER_TEMP/visual-list"

      - name: Upload visual changes
        if: ${{ steps.changes.outputs.count != '0' && steps.changes.outputs.count != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-changes
          path: ${{ runner.temp }}/visual-changes/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit visual baselines
        id: commit
        if: ${{ needs.storybook.result == 'success' && steps.changes.outputs.count != '0' && steps.changes.outputs.count != '' }}
        run: |
          dir="$RUNNER_TEMP/baselines"
          cat > "$dir/README.md" <<'MD'
          # Visual baselines

          CI's screenshots of every Storybook story (light/, dark/), one PNG per
          story id. Written only by the visual-baselines job of the CI workflow on
          main: each commit here is the look a main commit changed. Don't edit by
          hand. To undo a change, fix the code on main; the next run records it again.
          MD
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "visual: ${{ steps.changes.outputs.count }} change(s) from ${GITHUB_SHA::7}" \
            -m "$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s "$GITHUB_SHA")" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # A run that started earlier may have pushed meanwhile: then this
          # one only warns; the next main run records the same look again.
          if git push --quiet origin HEAD:visual-baselines; then
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::visual-baselines moved during this run; not recorded"
          fi

      - name: Visual summary
        if: ${{ steps.changes.outputs.count != '' }}
        run: |
          {
            echo "### Visual changes: ${{ steps.changes.outputs.count }}"
            if [ "${{ steps.changes.outputs.count }}" != "0" ]; then
              if [ -n "${{ steps.commit.outputs.url }}" ]; then
                echo "Recorded as the new baselines: ${{ steps.commit.outputs.url }} (before / after per PNG). Also as the artifact **visual-changes**."
              else
                echo "Not recorded (a storybook shard failed). Before / after PNGs: artifact **visual-changes**."
              fi
              cat "$RUNNER_TEMP/visual-list"
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  brands:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        brand: [iris, lime, ember]
    name: brand (${{ matrix.brand }})
    env:
      THEYA_BRAND: ${{ matrix.brand }}
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:tokens
        working-directory: .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe, ${{ matrix.brand }} light
        run: pnpm test-storybook

      - name: Play + axe, ${{ matrix.brand }} dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark

  mobile:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: phone (360)
    env:
      THEYA_VIEWPORT: 360
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:tokens
        working-directory: .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Play + axe at 360px, light
        run: pnpm test-storybook

      - name: Play + axe at 360px, dark
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm test-storybook:dark

  a11y:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Four machines, every 4th component each (--shard): the browser checks
    # took ~39 min on one runner and set the length of the whole run.
    # Nothing is skipped; each shard runs both scripts on its components.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: accessibility checks (${{ matrix.shard }}/4)
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:tokens
        working-directory: .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        id: serve
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      - name: Accessibility tree (names, images, headers, error association)
        run: node scripts/a11y-tree.mjs --url http://localhost:6008 --workers 2 --ci --shard ${{ matrix.shard }}/4

      - name: Browser checks (label in name, focus visible, text spacing, 200% text, Tab)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/a11y-auto.mjs --url http://localhost:6008 --workers 2 --ci --shard ${{ matrix.shard }}/4

  react-18:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Two machines, half the story files each (light only, so two are enough).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: react-18 (${{ matrix.shard }}/2)
    defaults:
      run:
        working-directory: packages/theya-shadcn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Overrides reach every package, so no dependency can pull React 19
      # into the Storybook bundle. 18.3 is the oldest the peer range allows.
      - name: Force React 18
        working-directory: .
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'
          overrides:
            react: ~18.3.0
            react-dom: ~18.3.0
            '@types/react': ~18.3.0
            '@types/react-dom': ~18.3.0
          YAML
          pnpm install --no-frozen-lockfile
      - name: Only React 18 is installed
        working-directory: .
        run: |
          node -p "'react ' + require('./packages/theya-shadcn/node_modules/react/package.json').version"
          if ls node_modules/.pnpm | grep -E '^react(-dom)?@19\.'; then echo "React 19 still installed"; exit 1; fi
      - run: pnpm build:tokens
        working-directory: .

      - name: Types
        run: pnpm exec tsc --noEmit -p .

      - name: Install Chromium for the test-runner
        run: |
          PW_DIR=$(node -e "const r=require.resolve('@storybook/test-runner');console.log(require('path').dirname(require.resolve('playwright/package.json',{paths:[r]})))")
          node "$PW_DIR/cli.js" install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Serve Storybook on :6008
        run: |
          python3 -m http.server 6008 --directory storybook-static >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6008/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" && exit 1

      # Light only: play tests and axe don't depend on the theme for React
      # behaviour; the storybook job covers dark and visual regression.
      - name: Play + axe on React 18 (shard ${{ matrix.shard }}/2)
        run: pnpm test-storybook --shard=${{ matrix.shard }}/2
