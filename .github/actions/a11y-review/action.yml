# The change review itself (packages/a11y-kit/review/agent.md), shared by the
# push review (a11y-review.yml) and its calibration (a11y-review-calibrate.yml).
# Expects the repository checked out at `to`, with history back to `from`.
# Writes a11y-review-run/{change.diff,context.md,findings.json,session.json}.
name: a11y change review
description: Runs the a11y-kit review agent on one commit range.
inputs:
  from:
    description: Review from this commit (exclusive)
    required: true
  to:
    description: Review up to this commit
    required: true
  oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN
    required: true
outputs:
  files:
    description: Files in the change (0 = nothing to review, no agent run)
    value: ${{ steps.diff.outputs.files }}
runs:
  using: composite
  steps:
    - name: Change and context
      id: diff
      shell: bash
      working-directory: packages/theya-shadcn
      run: |
        # In the workspace, not RUNNER_TEMP, so the agent's file tools can reach it (it is not committed).
        mkdir -p "$GITHUB_WORKSPACE/a11y-review-run"
        node ../a11y-kit/bin/a11y-kit.mjs review-diff ${{ inputs.from }} ${{ inputs.to }} --out "$GITHUB_WORKSPACE/a11y-review-run/change.diff"
        node ../a11y-kit/bin/a11y-kit.mjs review-context --out "$GITHUB_WORKSPACE/a11y-review-run/context.md"

    # The repository's Claude Code hooks are for the agents working in it, not for this run.
    - name: Drop repository hooks
      if: steps.diff.outputs.files != '0'
      shell: bash
      run: rm -f .claude/settings.json

    # The contrast command reads the built token CSS (packages/tokens/build is not committed).
    - uses: pnpm/action-setup@v5
      if: steps.diff.outputs.files != '0'
      with:
        version: 11.8.0
    - uses: actions/setup-node@v5
      if: steps.diff.outputs.files != '0'
      with:
        node-version: 22
        cache: pnpm
    - name: Build tokens
      if: steps.diff.outputs.files != '0'
      shell: bash
      run: |
        pnpm install --frozen-lockfile --filter "@theya/tokens..."
        pnpm build:tokens
        node packages/a11y-kit/bin/a11y-kit.mjs contrast border background --cwd packages/theya-shadcn

    # Claude Code itself, not claude-code-action: the action does not run on push events.
    - name: Review
      if: steps.diff.outputs.files != '0'
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth-token }}
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        PROMPT="Review one change to this design system for accessibility.

        Method (follow it exactly): packages/a11y-kit/review/agent.md
        The change: a11y-review-run/change.diff (commits $FROM..$TO)
        Context: a11y-review-run/context.md
        Write your findings to: a11y-review-run/findings.json

        Write nothing else and change no other file."
        # Opus: a wrong finding costs more than a slow run (review/agent.md).
        "$HOME/.local/bin/claude" -p "$PROMPT" \
          --model claude-opus-5-5 \
          --max-turns 80 \
          --allowedTools "Read,Glob,Grep,Write,Bash(git show:*),Bash(git diff:*),Bash(git log:*),Bash(node packages/a11y-kit/bin/a11y-kit.mjs contrast:*)" \
          --output-format json > a11y-review-run/session.json || true
        node -e "const s=require('./a11y-review-run/session.json'); console.log(JSON.stringify({ error: s.is_error, turns: s.num_turns, seconds: Math.round(s.duration_ms / 1000), denied: (s.permission_denials ?? []).map((d) => d.tool_name + ' ' + JSON.stringify(d.tool_input).slice(0, 120)) }))" || true
