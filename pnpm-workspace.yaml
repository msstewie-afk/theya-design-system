packages:
  - 'packages/*'
  - 'apps/*'
  # The pilot app installs @theya/shadcn from a packed tarball, like an app
  # outside the monorepo would (apps/pilot/README.md), so it stays out.
  - '!apps/pilot'
allowBuilds:
  '@bundled-es-modules/glob': true
  '@swc/core': true
  esbuild: true
  style-dictionary: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - recharts@3.10.0
