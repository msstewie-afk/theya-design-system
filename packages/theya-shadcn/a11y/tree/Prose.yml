# Article (layout-prose--article)
- article:
  - heading "Moving a site to a new region" [level=1]
  - paragraph:
    - text: A region move copies your site, its databases and its certificates to the new location, then switches traffic over once everything checks out. Visitors keep being served from the old region until the switch, so there is
    - strong: no downtime
    - text: for a typical site.
  - paragraph:
    - text: Before you start, check the
    - link "regional limits":
      - /url: "#limits"
    - text: and make sure the site has a recent backup. Press ⌘ K and type
    - code: move region
    - text: to open the flow from anywhere.
  - heading "Before you start" [level=2]
  - list:
    - listitem: The target region must support every add-on the site uses.
    - listitem:
      - text: Custom DNS records stay as they are. If you point an
      - code: A
      - text: "record straight at an IP address, update it after the move:"
      - list:
        - listitem:
          - text: for apex domains, switch to the
          - code: ALIAS
          - text: record we provide;
        - listitem:
          - text: for subdomains, a
          - code: CNAME
          - text: is enough.
    - listitem: Scheduled jobs pause during the copy and resume on their own.
  - heading "Move the site" [level=2]
  - list:
    - listitem:
      - text: Open the site and go to
      - strong: Settings → Infrastructure
      - text: .
    - listitem:
      - text: Choose
      - strong: Change region
      - text: and pick the target from the list.
    - listitem: Review the summary and start the move. You can close the page — we email you when it finishes.
  - blockquote:
    - paragraph: A move between continents can take a few hours for sites with large media libraries. Most moves finish in under 20 minutes.
  - heading "Doing it from the command line" [level=3]
  - paragraph: "The CLI runs the same checks and prints the plan before it changes anything:"
  - code: seashell sites move shop.seashell.dev \ --to eu-central-1 \ --dry-run
  - heading "What gets copied" [level=3]
  - table:
    - rowgroup:
      - row "Resource Copied Notes":
        - columnheader "Resource"
        - columnheader "Copied"
        - columnheader "Notes"
    - rowgroup:
      - row "Files and media Yes Incremental — only changes since the first pass are copied at switch time.":
        - cell "Files and media"
        - cell "Yes"
        - cell "Incremental — only changes since the first pass are copied at switch time."
      - row "Databases Yes Writes are held for a few seconds during the final sync.":
        - cell "Databases"
        - cell "Yes"
        - cell "Writes are held for a few seconds during the final sync."
      - row "Access logs No Older logs stay readable in the old region for 30 days.":
        - cell "Access logs"
        - cell "No"
        - cell "Older logs stay readable in the old region for 30 days."
  - separator
  - heading "Still stuck?" [level=4]
  - paragraph:
    - mark: Moves can be cancelled
    - text: until traffic switches over. After that, start a new move back to the original region. Last updated 2 October 2026.

# In Product Help (layout-prose--in-product-help)
- complementary:
  - heading "About API key scopes" [level=3]
  - paragraph:
    - text: A key can only do what its scopes allow. Give each integration the
    - strong: narrowest
    - text: set it needs — you can widen it later without creating a new key.
  - term: read:sites
  - definition: List sites and read their settings.
  - term: write:deploys
  - definition: Start and cancel deploys.
  - paragraph:
    - link "Read the full scopes reference":
      - /url: "#"

# Legal Page (layout-prose--legal-page)
- heading "Acceptable use" [level=1]
- paragraph: These terms describe what you may and may not host on Seashell. They apply to every site on your account, including staging sites.
- heading "1. Prohibited content" [level=2]
- list:
  - listitem:
    - text: "You may not host content that:"
    - list:
      - listitem: distributes malware or phishing pages;
      - listitem: sends unsolicited bulk email from our infrastructure;
      - listitem: infringes someone else’s rights.
  - listitem: We may suspend a site that breaks these rules after notifying the account owner, or immediately when there is an active risk to others.
- heading "2. Reporting a problem" [level=2]
- paragraph:
  - text: Send reports to
  - link "abuse@seashell.dev":
    - /url: mailto:abuse@seashell.dev
  - text: . Include the URL and what you found; we reply within one business day.

