# With Components (layout-prose--with-components)
- heading "Rotating a leaked key" [level=2]
- paragraph: If a key ends up somewhere public, revoke it first and create the replacement second — the order matters.
- text: Revoking is immediate Every integration using the old key stops working the moment you revoke it.
- paragraph: "Then update the environment variable wherever the key is used:"
- text: .env
- button "Copy code"
- code: SEASHELL_API_KEY=sk_demo_replace_me
- paragraph: When everything is green again, close the incident.
- button "Revoke key"
- button "Cancel"
