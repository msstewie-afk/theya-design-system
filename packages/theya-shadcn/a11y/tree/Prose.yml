# Accessibility tree per story. Generated by scripts/a11y-tree.mjs. Do not edit.

# Article (layout-prose--article)
- article:
  - heading "Moving a gallery to another studio" [level=1]
  - paragraph:
    - text: A move copies the gallery, its originals and its licenses to the new studio, then switches the client portal over once everything checks out. Clients keep seeing the gallery at the old address until the switch, so there is
    - strong: no downtime
    - text: for a typical gallery.
  - paragraph:
    - text: Before you start, check the
    - link "studio limits":
      - /url: "#limits"
    - text: and make sure the gallery is in the archive. Press ⌘ K and type
    - code: move gallery
    - text: to open the flow from anywhere.
  - heading "Before you start" [level=2]
  - list:
    - listitem: The target studio must have room for every original in the gallery.
    - listitem:
      - text: "Client picks and comments move with the gallery. Print orders already sent to the lab stay where they are:"
      - list:
        - listitem: orders in progress finish at the old studio;
        - listitem: new orders go to the new one.
    - listitem: Scheduled deliveries pause during the copy and resume on their own.
  - heading "Move the gallery" [level=2]
  - list:
    - listitem:
      - text: Open the gallery and go to
      - strong: Settings → Studio
      - text: .
    - listitem:
      - text: Choose
      - strong: Move to another studio
      - text: and pick the target from the list.
    - listitem: Review the summary and start the move. You can close the page — we email you when it finishes.
  - blockquote:
    - paragraph: A wedding with a few thousand RAW files can take an hour to move. Most galleries finish in under 5 minutes.
  - heading "Doing it from the command line" [level=3]
  - paragraph: "The CLI runs the same checks and prints the plan before it changes anything:"
  - code: aether galleries move golden-hour \ --to selene-weddings \ --dry-run
  - heading "What gets copied" [level=3]
  - table:
    - rowgroup:
      - row "Item Copied Notes":
        - columnheader "Item"
        - columnheader "Copied"
        - columnheader "Notes"
    - rowgroup:
      - row "Originals and edits Yes Incremental — only changes since the first pass are copied at switch time.":
        - cell "Originals and edits"
        - cell "Yes"
        - cell "Incremental — only changes since the first pass are copied at switch time."
      - row "Client picks Yes Picking is paused for a few seconds during the final sync.":
        - cell "Client picks"
        - cell "Yes"
        - cell "Picking is paused for a few seconds during the final sync."
      - row "Download history No Older history stays readable in the old studio for 30 days.":
        - cell "Download history"
        - cell "No"
        - cell "Older history stays readable in the old studio for 30 days."
  - separator
  - heading "Still stuck?" [level=4]
  - paragraph:
    - mark: Moves can be cancelled
    - text: until the portal switches over. After that, start a new move back to the original studio. Last updated 2 October 2026.

# In Product Help (layout-prose--in-product-help)
- complementary:
  - heading "About API key scopes" [level=3]
  - paragraph:
    - text: A key can only do what its scopes allow. Give each integration the
    - strong: narrowest
    - text: set it needs — you can widen it later without creating a new key.
  - term: read:galleries
  - definition: List galleries and read their settings.
  - term: write:exports
  - definition: Start and cancel exports.
  - paragraph:
    - link "Read the full scopes reference":
      - /url: "#"

# Legal Page (layout-prose--legal-page)
- heading "Acceptable use" [level=1]
- paragraph: These terms describe what you may and may not publish on Aether. They apply to every gallery on your account, including drafts.
- heading "1. Prohibited content" [level=2]
- list:
  - listitem:
    - text: "You may not publish photos that:"
    - list:
      - listitem: show people who haven’t agreed to be published;
      - listitem: are sent to clients as unsolicited bulk email;
      - listitem: infringes someone else’s rights.
  - listitem: We may pause a gallery that breaks these rules after notifying the account owner, or immediately when there is an active risk to others.
- heading "2. Reporting a problem" [level=2]
- paragraph:
  - text: Send reports to
  - link "abuse@aether.photo":
    - /url: mailto:abuse@aether.photo
  - text: . Include the URL and what you found; we reply within one business day.

