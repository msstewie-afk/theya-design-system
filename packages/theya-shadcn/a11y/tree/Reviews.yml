  - list:
    - listitem:
      - text: 5 out of 5 stars Saved a client site in five minutes
      - paragraph: Dana K.Sep 20, 2026
      - paragraph: A dependency update broke the store. Restored last night’s database to staging, checked it, pushed it live. Exactly what a backup tool should be.
    - listitem:
      - text: 5 out of 5 stars
      - paragraph: Lina S.Aug 28, 2026
      - paragraph: Incremental runs take under two minutes for 40 sites. Storage bill went down by half.
    - listitem:
      - text: 4 out of 5 stars Solid, setup could be clearer
      - paragraph: Marco P.Sep 2, 2026
      - paragraph: Works well with Wasabi. It took me a while to find where to paste the endpoint — the first screen only mentions Amazon.
      - paragraph: Arbor Developer Sep 4, 2026
      - paragraph: Thanks, Marco — the next version shows every provider on the first screen.
    - listitem:
      - text: 1 out of 5 stars First run filled my disk
      - paragraph: Sam O.Jun 3, 2026
      - paragraph: The first full backup used the local staging area and ran out of space. Check the disk requirement before installing.
    - listitem:
      - text: 2 out of 5 stars Database restore is all or nothing
      - paragraph: Tom W.Aug 15, 2026
      - paragraph: I can restore a single file but not a single table. For projects with big databases that matters.
      - paragraph: Arbor Developer Aug 16, 2026
      - paragraph: Per-table restore is in beta now — write to support and we’ll turn it on.
    - listitem:
      - text: 5 out of 5 stars
      - paragraph: Priya R.Jul 30, 2026
      - paragraph: Set it up once two years ago and it just runs. Alerts when a run fails are useful.
    - listitem:
      - text: 3 out of 5 stars Fine, a bit pricey for one site
      - paragraph: Jonas B.Jul 12, 2026
      - paragraph: Great for agencies; for a single small site the price is hard to justify.
    - listitem:
      - text: 4 out of 5 stars
      - paragraph: Elif A.Jun 21, 2026
      - paragraph: Restores are reliable. Would love a dark mode for the dashboard.

