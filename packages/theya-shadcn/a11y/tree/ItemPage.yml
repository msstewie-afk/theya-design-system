    - heading "Overview" [level=2]
    - text: Vault Backup copies your projects, databases and files to the storage you choose, on the schedule you choose. After the first full run it only sends what changed, so backups finish in minutes and storage costs stay low.
    - heading "Restore what you need" [level=3]
    - text: Pick a point in time and restore a single file, one database or everything. Restores can go to a staging copy first, so you can check before you overwrite.
    - heading "Storage" [level=3]
    - text: Works with Amazon S3, Backblaze B2, Wasabi, MinIO and any other S3-compatible service. Keep a second copy in another region with one switch.
    - heading "Security" [level=3]
    - text: Archives are encrypted with AES-256 before upload. The key stays on your server; we never see it.
